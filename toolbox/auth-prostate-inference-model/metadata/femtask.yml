cwlVersion: v1.2
class: FEMTask

id: prostate-cancer-classifier
label: Prostate Cancer Classification (cisPCa vs csPCa)
doc: |
  FEM atomic task for prostate cancer type classification.
  Uses radiomic features from ADC and T2W MRI DICOM series, DICOM scanner
  metadata, and PSA/age clinical data to run a Balanced Random Forest (BRF)
  inference. Optionally generates LIME or ANCHOR XAI explanations.

requirements:
  - class: DockerRequirement
    # Replace with the actual image URL from the EUCAIM Harbor registry.
    dockerPull: harbor.eucaim.cancerimage.eu/processing-tools/auth-prostate-inference-model

  - class: ResourceRequirement
    coresMin: 2
    ramMin: 8192

  - class: InitialWorkDirRequirement
    listing:
      # Map CWL-staged inputs to the paths the tool expects inside the container.
      # The FEM platform is responsible for these volume bindings at runtime.
      - entryname: /tmp/input/data
        entry: $(inputs.input_data_dir)
        writable: false
      - entryname: /tmp/input/configs/user_vars.json
        entry: $(inputs.user_vars_config)
        writable: false
      - entryname: /tmp/output
        entry: ""
        writable: true

# Entrypoint of the standalone (non-API) Dockerfile_not_api.
# Executed from WORKDIR /usr/application; reads environment paths from
# src/config/environment_vars_platform.json (baked into the image).
# clinical_template/t2w_series_uid/adc_series_uid are passed as CLI flags
# (see inputBinding below) instead of living inside user_vars.json, since
# FEM can only rewrite paths/filenames that are real CWL inputs, not values
# buried in file content. The model filename is NOT a CWL input at all:
# exactly one model ships per image build, so the container discovers it on
# disk instead of being told its name. MR sequence role (T2W vs ADC) can't be
# reliably auto-detected from DICOM tags (SeriesDescription is free text and
# not standardized across sites), so the submitter must declare which
# series_uid is which explicitly.
baseCommand: [python3, src/main.py]

inputs:
  - id: input_data_dir
    type: Directory
    doc: |
      Patient imaging and clinical data directory, following the EUCAIM CDM.
      Mounted at /tmp/input/data. Expected contents:
        imaging_data/<patient_id>/<study_uid>/<series_uid>/*.dcm
          — one series_uid folder is the T2W series (see t2w_series_uid)
          — one series_uid folder is the ADC series (see adc_series_uid)
          — one series_uid folder is the prostate gland segmentation, a
            single multi-frame DICOM SEG instance (Modality=SEG) referencing
            the T2W series via ReferencedSeriesSequence
        <clinical_template> — CDM clinical_mandatory_view.csv-style table,
          containing at least the patient_id, age and PSA for this patient
    required: true
    hidden: true
    source: connection

  - id: clinical_template
    type: string
    doc: Filename of the clinical CSV (e.g. clinical_mandatory_view.csv) present in input_data_dir.
    required: true
    hidden: false
    source: user
    inputBinding:
      prefix: --clinical-template

  - id: t2w_series_uid
    type: string
    doc: SeriesInstanceUID of the T2W series (the imaging_data/<patient_id>/<study_uid>/<series_uid> folder name).
    required: true
    hidden: false
    source: user
    inputBinding:
      prefix: --t2w-series

  - id: adc_series_uid
    type: string
    doc: SeriesInstanceUID of the ADC series (the imaging_data/<patient_id>/<study_uid>/<series_uid> folder name).
    required: true
    hidden: false
    source: user
    inputBinding:
      prefix: --adc-series

  - id: user_vars_config
    type: File
    doc: |
      User configuration JSON. Required fields:
        Debug (bool)                  — reuse cached radiomics CSV from a prior run
        save_intermediate_data (bool) — persist radiomics_results.csv and metadata.csv
        explainability_mode (int)     — 0 = disabled, 1 = enabled
        explain_method (str)          — "lime" or "anchor"
        dwi_image_type (bool)         — true: ADC PNGs; false: T2W PNGs
    required: true
    hidden: false
    source: user

outputs:
  - id: results_json
    type: File
    doc: |
      JSON classification result at /tmp/output/results.json.
        pred_label: "cisPCa" | "csPCa"
        prob: probability as a percentage string (e.g. "72.35%")
    outputBinding:
      glob: /tmp/output/results.json

  - id: png_output_dir
    type: Directory
    doc: |
      PNG visualisations at /tmp/output/pngs/.
        *.png      — DICOM slice images
        *_xai.png  — LIME or ANCHOR explanation chart (if enabled)
    outputBinding:
      glob: /tmp/output/pngs

expectedExitCode: 0

metadata:
  author: iladakig@auth.gr
  version: "1.0"
  orchestrator:
    network: bridge
