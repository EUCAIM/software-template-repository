cwlVersion: v1.2
class: FEMTask

id: prostate-cancer-classifier
label: Prostate Cancer Classification (cisPCa vs csPCa)
doc: |
  FEM atomic task for prostate cancer type classification.
  Uses radiomic features from ADC and T2W MRI DICOM series, DICOM scanner
  metadata, and PSA/age clinical data to run a Balanced Random Forest (BRF)
  inference. Optionally generates LIME or ANCHOR XAI explanations.

requirements:
  - class: DockerRequirement
    # Pinned image tag in the EUCAIM Harbor registry (no latest / untagged).
    dockerPull: harbor.eucaim.cancerimage.eu/processing-tools/auth-prostate-inference-model:1.1.0

  - class: ResourceRequirement
    coresMin: 2
    ramMin: 8192

# Exactly matches the Dockerfile_not_api ENTRYPOINT ["python3", "src/main.py"],
# executed from WORKDIR /usr/application.
# Input and output locations are passed as CLI arguments (--input, --output,
# --user-vars; see inputBinding below) so FEM and Jobman can place them in the
# run-time sandbox - the tool no longer reads/writes fixed /tmp locations.
# clinical_template is also a CLI flag rather than a value buried in
# user_vars.json, since FEM can only rewrite real CWL inputs. The model file is
# NOT a CWL input: exactly one model ships per image build, so the container
# discovers it on disk.
# MR sequence role (T2W vs ADC) is auto-detected from acquisition geometry
# (T2W is acquired at a much finer in-plane resolution than the DWI-derived ADC
# map), so the user does not supply the series UIDs. --t2w-series/--adc-series
# remain available as a manual override for a plain docker run but are not CWL
# inputs.
baseCommand: [python3, src/main.py]

inputs:
  - id: input_data_dir
    type: Directory
    doc: |
      Patient imaging and clinical data directory, following the EUCAIM CDM.
      Passed to the tool via --input. Expected contents:
        imaging_data/<patient_id>/<study_uid>/<series_uid>/*.dcm
          — two series_uid folders are the T2W and ADC MR series; their roles
            are auto-detected from acquisition geometry (T2W is the finer
            in-plane resolution, ADC the coarser), so no UIDs are required
          — one series_uid folder is the prostate gland segmentation, a
            single multi-frame DICOM SEG instance (Modality=SEG) referencing
            the T2W series via ReferencedSeriesSequence
        <clinical_template> — CDM clinical_mandatory_view.csv-style table,
          containing at least the patient_id, age and PSA for this patient
    required: true
    hidden: true
    source: connection
    inputBinding:
      prefix: --input

  - id: clinical_template
    type: string
    doc: Filename of the clinical CSV (e.g. clinical_mandatory_view.csv) present in input_data_dir.
    required: true
    hidden: false
    source: user
    inputBinding:
      prefix: --clinical-template

  # t2w_series_uid / adc_series_uid are intentionally not CWL inputs: the tool
  # auto-detects the T2W and ADC series from acquisition geometry, so a
  # federated user does not need to know the UIDs. The --t2w-series/--adc-series
  # CLI overrides still exist for manual docker runs.

  - id: user_vars_config
    type: File
    doc: |
      User configuration JSON. Required fields:
        Debug (bool)                  — reuse cached radiomics CSV from a prior run
        save_intermediate_data (bool) — persist radiomics_results.csv and metadata.csv
        explainability_mode (int)     — 0 = disabled, 1 = enabled
        explain_method (str)          — "lime" or "anchor"
        dwi_image_type (bool)         — true: ADC PNGs; false: T2W PNGs
    required: true
    hidden: false
    source: user
    inputBinding:
      prefix: --user-vars

  - id: output_dir
    type: string
    doc: |
      Output directory for results.json and pngs/. FEM/Jobman set this to the
      run-time sandbox via --output; it defaults to the CWL output directory.
    required: false
    default: "."
    hidden: true
    source: user
    inputBinding:
      prefix: --output
      valueFrom: $(runtime.outdir)

outputs:
  - id: results_json
    type: File
    doc: |
      JSON classification result (results.json in the output directory).
        pred_label: "cisPCa" | "csPCa"
        prob: probability as a percentage string (e.g. "72.35%")
    outputBinding:
      glob: $(runtime.outdir)/results.json

  - id: png_output_dir
    type: Directory
    doc: |
      PNG visualisations (pngs/ in the output directory).
        *.png      — DICOM slice images
        *_xai.png  — LIME or ANCHOR explanation chart (if enabled)
    outputBinding:
      glob: $(runtime.outdir)/pngs

expectedExitCode: 0

metadata:
  author: iladakig@auth.gr
  version: "1.0"
  orchestrator:
    network: bridge
