cwlVersion: v1.2
class: FEMWorkflow

id: prostate-cancer-workflow
label: Prostate Cancer ISUP-based Classification Workflow
doc: |
  Standalone workflow for prostate cancer type prediction (cisPCa vs csPCa).
  Executes the prostate-prediction bundle at a single site using ADC and T2W
  MRI DICOM series, a prostate gland segmentation mask, and clinical data
  (PSA, age). Outputs a JSON classification result and optional PNG
  visualisations with LIME or ANCHOR explainability.

# ---- Site slots ---------------------------------------------------------------
execution_sites:
  - alias: inference-site
    kind: single
    selection: user
    doc: Site where patient MRI data resides and inference will be executed.

# ---- Bundle bindings ----------------------------------------------------------
bundles:
  - bundle_id: prostate-prediction
    doc: Prostate cancer classification bundle (standalone mode).
    site_bindings:
      - role: worker
        site: inference-site

# ---- Workflow inputs (THE FORM) -----------------------------------------------
inputs:
  - id: input_data_dir
    type: Directory
    doc: |
      Patient imaging and clinical data directory (provided by the site's
      data store), following the EUCAIM CDM. Required contents:
        imaging_data/<patient_id>/<study_uid>/<series_uid>/*.dcm
          — one series_uid folder is the T2W series (see t2w_series_uid)
          — one series_uid folder is the ADC series (see adc_series_uid)
          — one series_uid folder is the prostate gland segmentation, a
            single multi-frame DICOM SEG instance (Modality=SEG) referencing
            the T2W series via ReferencedSeriesSequence
        <clinical_template> — CDM clinical_mandatory_view.csv-style table,
          containing at least the patient_id, age and PSA for this patient
    required: true
    hidden: true
    scope: per_node
    targets:
      - bundle_id: prostate-prediction
        bundle_input_name: input_data_dir

  - id: clinical_template
    type: string
    doc: Filename of the clinical CSV (e.g. clinical_mandatory_view.csv) present in input_data_dir.
    required: true
    hidden: false
    scope: global
    targets:
      - bundle_id: prostate-prediction
        bundle_input_name: clinical_template

  - id: t2w_series_uid
    type: string
    doc: |
      SeriesInstanceUID of the T2W series. MR sequence role can't be
      auto-detected from DICOM tags, so the submitter must declare it.
    required: true
    hidden: false
    scope: global
    targets:
      - bundle_id: prostate-prediction
        bundle_input_name: t2w_series_uid

  - id: adc_series_uid
    type: string
    doc: SeriesInstanceUID of the ADC series (same reasoning as t2w_series_uid).
    required: true
    hidden: false
    scope: global
    targets:
      - bundle_id: prostate-prediction
        bundle_input_name: adc_series_uid

  - id: user_vars_config
    type: File
    doc: |
      User configuration JSON. Upload a file with the following structure:
        {
          "Debug": false,
          "save_intermediate_data": true,
          "explainability_mode": 1,
          "explain_method": "lime",
          "dwi_image_type": true
        }
      Allowed explain_method values: "lime", "anchor".
      Set explainability_mode to 0 to disable XAI.
    required: true
    hidden: false
    scope: global
    targets:
      - bundle_id: prostate-prediction
        bundle_input_name: user_vars_config

# ---- Workflow outputs ---------------------------------------------------------
outputs:
  - id: classification_result
    type: File
    doc: |
      JSON file with the predicted prostate cancer type and probability.
        pred_label: "cisPCa" (clinically insignificant) | "csPCa" (clinically significant)
        prob: probability percentage (e.g. "72.35%")
    source:
      bundle_id: prostate-prediction
      bundle_output_name: results_json

  - id: png_visualizations
    type: Directory
    doc: |
      Directory containing PNG exports of DICOM slices and, if XAI is enabled,
      LIME or ANCHOR explanation charts.
    source:
      bundle_id: prostate-prediction
      bundle_output_name: png_output_dir

# ---- Workflow-level metadata --------------------------------------------------
metadata:
  author: iladakig@auth.gr
  version: "1.0"
  apps:
    app_name: OpenVRE
    enabled: true
    version_control:
      repository: ""
      branch: main
  compliance:
    data_classification: private
    retention_policy:
      inputs_retention: session
      outputs_retention: 30d
      logs_retention: 30d
  security:
    access_control:
      - role: researcher
        permissions: [read, execute]
